<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestão de Carteira TOTVS ESN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style id="appcss">{{CSS}}</style>
<script>try{var t=localStorage.getItem('rf.theme');if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';if(t==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>

<div class="sb-foot" id="sbfoot"></div>
</aside>

<div class="main-col">
<header class="top" id="top"></header>
<main id="main"><div id="app" tabindex="-1"><div class="skeleton" aria-busy="true" aria-label="Carregando"><i class="sk w40"></i><div class="grid g4"><i class="sk h70"></i><i class="sk h70"></i><i class="sk h70"></i><i class="sk h70"></i></div><i class="sk h160"></i></div></div></main>
</div>
</div>
<div id="modal"></div>
<div id="tip" role="tooltip" hidden></div>

<script>
const LOGO_W="{{LOGO_W}}";
const PDF_WORKER_DIRECT='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

{{JS}}
</script></body></html>
