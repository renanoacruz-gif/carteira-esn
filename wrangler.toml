name = "carteira-esn"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# App (public/) + API (Worker) no mesmo endereço. Só /api/* e /backend passam pelo código do Worker.
[assets]
directory = "./public"
run_worker_first = ["/api/*", "/backend"]

# Banco compartilhado (catálogo) + carteira de cada executivo. O id é gerado por: wrangler d1 create carteira-esn
[[d1_databases]]
binding = "DB"
database_name = "carteira-esn"
database_id = "34fc3064-d8fe-4d5a-91e4-7e02c6fce2bc"

[vars]
ALLOWED_DOMAIN = "totvs.com.br"          # só e-mails deste domínio entram (o Cloudflare Access também restringe)
ADMIN_EMAILS = "renan.oscar@totvs.com.br"   # quem pode excluir registros do catálogo criados por outros (separe por vírgula)
ACCESS_TEAM = "billowing-paper-7b4d.cloudflareaccess.com"   # domínio do time Zero Trust (não é segredo)
ACCESS_AUD = "6adb058f7cefc1043743382577cf95aa70a156b6d6ed7d9455ba8b8856eadcb2"   # AUD tag do aplicativo Access (Workers & Pages → carteira-esn → Access → AUD tag → copiar)

# Segredos (NÃO coloque valores aqui). Chaves de IA ficam com cada executivo, no navegador dele.
#   wrangler secret put APP_TOKEN        # opcional: só para a página manual /backend
# NUNCA defina ALLOW_TEST_USER em produção (existe só para testes locais).
